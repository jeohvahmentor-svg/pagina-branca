name: Loto Intelligence CI
on:
  pull_request:
  push:
    branches:
      - feat/loto-intelligence-mvp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
